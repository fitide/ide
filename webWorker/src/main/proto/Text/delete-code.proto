syntax = "proto3";

package textDeleting;

import "constants/responsesCodes.proto";
import "Positions/positions.proto";

option java_multiple_files = true;
option java_package = "org.WebWorker.Text.Deleting";

message InsertTextServerRequest {
    string filePath = 1;
    positions.HighlightedPosition position = 2;
    string textToDelete = 3;
}

message InsertTextServerResponse {
    responsesCodes.DeleteTextCode code = 1;
    string error = 2;
}

message InsertTextClientRequest {
    string filePath = 1;
    positions.HighlightedPosition position = 2;
}

