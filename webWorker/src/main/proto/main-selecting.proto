syntax = "proto3";

package mainSelecting;

import "constants/responsesCodes.proto";

option java_multiple_files = true;
option java_package = "org.WebWorker.MainSelecting";

message Programmer {
    string host = 1;
    uint32 clientNumber = 2;
}

message UpdateProgrammersRequest {
    repeated Programmer programmers = 1;
}

message UpdateProgrammersResponse {
    responsesCodes.UpdateProgrammersCode code = 1;
}

